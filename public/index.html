<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VAULT — Home Theater</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.4.12/hls.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0a090d;
  --surface:#13111a;
  --surface2:#1c1926;
  --border:#ffffff0f;
  --accent:#e8b04b;
  --accent-dim:#e8b04b44;
  --text:#f0eef8;
  --muted:#7a788a;
  --red:#e05252;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --ctrl-h:56px;
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body)}

/* ── NOISE OVERLAY ── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none;z-index:0;opacity:.4;
}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:50;
  padding:0 3rem;height:64px;
  display:flex;align-items:center;gap:1.5rem;
  background:linear-gradient(to bottom,var(--bg) 60%,transparent);
}
.logo{font-family:var(--font-display);font-size:1.9rem;letter-spacing:.12em;color:var(--accent)}
.logo span{color:var(--text);opacity:.35}
.header-right{margin-left:auto;display:flex;align-items:center;gap:.75rem}
.pill{
  font-size:.72rem;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 12px;border-radius:99px;
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
}

/* ── LIBRARY ── */
.container{max-width:1440px;margin:0 auto;padding:1rem 3rem 4rem;position:relative;z-index:1}
.section-title{
  font-family:var(--font-display);font-size:1rem;letter-spacing:.16em;
  color:var(--muted);text-transform:uppercase;margin-bottom:1.5rem;
}
#library{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1.25rem}

.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:8px;overflow:hidden;cursor:pointer;
  transition:transform .2s,box-shadow .2s,border-color .2s;
  position:relative;
}
.card:hover{
  transform:translateY(-5px) scale(1.01);
  box-shadow:0 20px 60px #0009,0 0 0 1px var(--accent-dim);
  border-color:var(--accent-dim);
}
.card-art{
  width:100%;aspect-ratio:16/9;
  background:var(--surface2);
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.card-art::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--surface2) 0%,#0a090d 100%);
}
.card-art-icon{position:relative;z-index:1;font-size:2rem;opacity:.25}
.card-art-num{
  position:absolute;bottom:8px;right:10px;
  font-family:var(--font-display);font-size:3.5rem;
  color:#ffffff08;line-height:1;z-index:1;letter-spacing:-.02em;
}
.card-body{padding:.85rem 1rem 1rem}
.card-title{
  font-size:.82rem;font-weight:500;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-meta{font-size:.7rem;color:var(--muted);margin-top:5px;display:flex;gap:.5rem}
.card-tag{
  background:var(--surface2);border:1px solid var(--border);
  padding:1px 6px;border-radius:3px;font-size:.65rem;letter-spacing:.04em;
}

/* ── EMPTY / ERROR ── */
#empty,#error-box{display:none;text-align:center;padding:5rem 2rem;color:var(--muted)}
#empty.show,#error-box.show{display:block}
#empty .icon{font-size:3rem;margin-bottom:1rem;opacity:.3}
#error-box{color:#fca5a5;background:#ef444411;border:1px solid #ef444433;border-radius:8px;padding:1rem 1.5rem;text-align:left;margin-bottom:1.5rem}

/* ══════════════════════════════════════════════════════════
   PRE-PLAY MODAL
══════════════════════════════════════════════════════════ */
#preplay-overlay{
  display:none;position:fixed;inset:0;z-index:300;
  background:#000000cc;backdrop-filter:blur(8px);
  align-items:center;justify-content:center;
}
#preplay-overlay.show{display:flex}

#preplay-card{
  background:var(--surface);
  border:1px solid #ffffff18;
  border-radius:16px;
  width:min(480px, calc(100vw - 2rem));
  max-height:calc(100vh - 4rem);
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 32px 80px #000000bb;
  animation:modal-in .2s ease;
}

@keyframes modal-in{
  from{opacity:0;transform:translateY(12px) scale(.97)}
  to  {opacity:1;transform:translateY(0)    scale(1)}
}

#preplay-header{
  padding:1.5rem 1.5rem 1rem;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
#preplay-title{
  font-family:var(--font-display);font-size:1.3rem;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:.25rem;
}
#preplay-subtitle{
  font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;
}

#preplay-body{
  padding:1.25rem 1.5rem;
  overflow-y:auto;
  flex:1;
  display:flex;flex-direction:column;gap:1.5rem;
}

/* Loading state inside modal */
#preplay-loading{
  display:flex;flex-direction:column;align-items:center;
  gap:1rem;padding:1.5rem 0;color:var(--muted);font-size:.85rem;
}
#preplay-loading.hide{display:none}

#preplay-tracks{display:none;flex-direction:column;gap:1.5rem}
#preplay-tracks.show{display:flex}

.track-section-label{
  font-size:.65rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.6rem;
}

.track-option{
  display:flex;align-items:center;gap:.75rem;
  padding:.7rem .9rem;border-radius:8px;
  border:1px solid transparent;
  cursor:pointer;
  transition:background .12s, border-color .12s;
  user-select:none;
}
.track-option:hover{background:#ffffff0a;border-color:#ffffff12}
.track-option.selected{
  background:var(--accent-dim);
  border-color:#e8b04b55;
}

.track-radio{
  width:16px;height:16px;border-radius:50%;flex-shrink:0;
  border:2px solid var(--muted);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .12s;
}
.track-option.selected .track-radio{border-color:var(--accent)}
.track-radio-dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  opacity:0;transform:scale(.3);
  transition:opacity .12s, transform .12s;
}
.track-option.selected .track-radio-dot{opacity:1;transform:scale(1)}

.track-option-info{flex:1;min-width:0}
.track-option-name{font-size:.83rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-option-detail{font-size:.7rem;color:var(--muted);margin-top:2px}

.track-badge{
  font-size:.6rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:4px;background:var(--surface2);
  border:1px solid var(--border);color:var(--muted);flex-shrink:0;
}
.track-option.selected .track-badge{
  background:#e8b04b22;border-color:#e8b04b55;color:var(--accent);
}

#preplay-footer{
  padding:1rem 1.5rem 1.5rem;
  border-top:1px solid var(--border);
  display:flex;gap:.75rem;
  flex-shrink:0;
}

.btn-cancel{
  background:none;border:1px solid #ffffff18;color:var(--muted);
  padding:10px 18px;border-radius:8px;cursor:pointer;
  font-size:.82rem;font-family:var(--font-body);
  transition:background .15s,color .15s;
}
.btn-cancel:hover{background:#ffffff0f;color:var(--text)}

.btn-play{
  flex:1;
  background:var(--accent);color:#0a090d;
  border:none;border-radius:8px;padding:10px 18px;
  font-size:.85rem;font-weight:600;font-family:var(--font-body);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  transition:opacity .15s;
}
.btn-play:hover{opacity:.88}
.btn-play:disabled{opacity:.4;cursor:not-allowed}
.btn-play svg{flex-shrink:0}

/* ═════════════════════════════════════════════
   PLAYER
═════════════════════════════════════════════ */
#player{
  display:none;position:fixed;inset:0;z-index:200;
  background:#000;flex-direction:column;
}
#player.show{display:flex}

#video-el{flex:1;width:100%;min-height:0;display:block;background:#000}

/* Controls wrapper */
#ctrl-wrap{
  position:absolute;inset:0;pointer-events:none;
  display:flex;flex-direction:column;
  transition:opacity .3s;
}
#ctrl-wrap.visible{pointer-events:auto}
#ctrl-wrap.hidden{opacity:0}

/* Top gradient + title bar */
#ctrl-top{
  background:linear-gradient(to bottom,#000b,transparent);
  padding:1.25rem 1.75rem;
  display:flex;align-items:center;gap:1rem;
  pointer-events:auto;
}
#player-title{
  font-family:var(--font-display);font-size:1.3rem;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
}

/* Now-playing audio badge in top bar */
#audio-now-playing{
  font-size:.7rem;color:var(--muted);
  background:var(--surface2);border:1px solid var(--border);
  padding:4px 10px;border-radius:6px;
  white-space:nowrap;flex-shrink:0;
}

.btn-back{
  background:none;border:1px solid #ffffff22;color:var(--text);
  padding:6px 14px;border-radius:6px;cursor:pointer;font-size:.8rem;
  font-family:var(--font-body);transition:background .15s;display:flex;align-items:center;gap:6px;
}
.btn-back:hover{background:#ffffff18}

#ctrl-spacer{flex:1}

/* Bottom gradient + controls */
#ctrl-bottom{
  background:linear-gradient(to top,#000e 30%,transparent);
  padding:0 1.5rem 1.25rem;
  pointer-events:auto;
}

/* Progress bar */
#progress-wrap{
  width:100%;padding:14px 0 10px;cursor:pointer;position:relative;
}
#progress-bg{height:3px;background:#ffffff22;border-radius:3px;position:relative;transition:height .15s}
#progress-wrap:hover #progress-bg{height:5px}
#progress-fill{height:100%;background:var(--accent);border-radius:3px;pointer-events:none;position:relative}
#progress-fill::after{
  content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;background:var(--accent);border-radius:50%;
  opacity:0;transition:opacity .15s;
}
#progress-wrap:hover #progress-fill::after{opacity:1}
#progress-input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}

/* Controls row */
#ctrl-row{display:flex;align-items:center;gap:.5rem}

.ctrl-btn{
  background:none;border:none;color:var(--text);cursor:pointer;
  padding:6px;border-radius:6px;display:flex;align-items:center;justify-content:center;
  transition:background .15s,color .15s;flex-shrink:0;font-size:.78rem;
  font-family:var(--font-body);
}
.ctrl-btn:hover{background:#ffffff18}
.ctrl-btn svg{display:block;flex-shrink:0}
.ctrl-btn.active{color:var(--accent)}

#vol-wrap{display:flex;align-items:center;gap:6px}
#vol-slider{
  -webkit-appearance:none;appearance:none;
  width:72px;height:3px;border-radius:3px;
  background:linear-gradient(to right,var(--accent) var(--pct,100%),#ffffff33 var(--pct,100%));
  outline:none;cursor:pointer;
}
#vol-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;
  background:var(--accent);border-radius:50%;
}

#time-display{font-size:.78rem;color:var(--muted);margin-left:4px;white-space:nowrap}

#ctrl-right{margin-left:auto;display:flex;align-items:center;gap:.25rem;position:relative}

/* Track menu buttons (subtitles only now) */
.menu-btn{
  display:flex;align-items:center;gap:5px;
  padding:6px 10px;border-radius:6px;
  background:none;border:1px solid transparent;
  color:var(--muted);cursor:pointer;font-size:.75rem;
  font-family:var(--font-body);transition:all .15s;white-space:nowrap;
}
.menu-btn:hover{background:#ffffff12;border-color:#ffffff22;color:var(--text)}
.menu-btn.has-content{color:var(--text)}
.menu-btn svg{flex-shrink:0}

/* Dropdown menus */
.track-menu{
  position:absolute;bottom:calc(100% + 10px);right:0;
  background:#1a1826;border:1px solid #ffffff1a;
  border-radius:10px;min-width:200px;padding:.5rem;
  display:none;flex-direction:column;gap:2px;
  box-shadow:0 16px 40px #00000088;z-index:10;
}
.track-menu.open{display:flex}
.menu-label{
  font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:6px 10px 4px;
}
.track-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:6px;cursor:pointer;
  font-size:.8rem;transition:background .12s;
}
.track-item:hover{background:#ffffff0f}
.track-item.selected{background:var(--accent-dim);color:var(--accent)}
.track-item .dot{
  width:7px;height:7px;border-radius:50%;border:2px solid var(--muted);flex-shrink:0;
}
.track-item.selected .dot{background:var(--accent);border-color:var(--accent)}
.track-item.off-item{color:var(--muted)}
.menu-divider{height:1px;background:#ffffff0f;margin:4px 0}

/* Loading overlay */
#loading-overlay{
  position:absolute;inset:0;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:1.25rem;
  background:#000c;z-index:5;
}
#loading-overlay.show{display:flex}
.spinner{
  width:48px;height:48px;
  border:3px solid #ffffff15;
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .9s linear infinite;
}
.spinner-sm{
  width:28px;height:28px;
  border:2px solid #ffffff15;
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{font-size:.85rem;color:var(--muted)}

/* Pause flash */
#play-flash{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:4;
}
.flash-icon{
  background:#000a;border-radius:50%;padding:18px;
  opacity:0;transform:scale(.6);
  transition:opacity .15s,transform .15s;
}
.flash-icon.show{opacity:1;transform:scale(1)}

/* Skip animation */
.skip-flash{
  position:absolute;top:50%;transform:translateY(-50%);
  background:#000a;border-radius:8px;padding:12px 20px;
  font-size:1rem;font-weight:600;color:var(--accent);
  opacity:0;transition:opacity .3s;pointer-events:none;z-index:4;
}
.skip-flash.show{opacity:1}
#skip-back-flash{left:12%}
#skip-fwd-flash{right:12%}

/* Chunk progress badge */
#chunk-badge{
  position:absolute;top:72px;right:16px;
  display:none;align-items:center;gap:8px;
  background:#0009;backdrop-filter:blur(8px);
  border:1px solid #ffffff18;border-radius:8px;
  padding:8px 14px;font-size:.75rem;color:var(--muted);
  pointer-events:none;z-index:20;
}
#chunk-badge.show{display:flex}
#chunk-badge .cb-bar{width:80px;height:4px;background:#ffffff18;border-radius:4px;overflow:hidden}
#chunk-badge .cb-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .5s}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:3px}

/* ── CUSTOM SUBTITLE DISPLAY ── */
#subtitle-display{
  position:absolute;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  max-width:80%;
  text-align:center;
  pointer-events:none;
  z-index:3;
  transition:bottom .25s ease;
  font-size:1.15rem;
  font-family:var(--font-body);
  font-weight:500;
  line-height:1.55;
  color:#fff;
  text-shadow:0 0 4px #000,0 1px 2px #000,0 2px 6px #0009;
  padding:4px 14px 6px;
  border-radius:4px;
  background:#00000055;
  white-space:pre-wrap;
  word-break:break-word;
}
#ctrl-wrap.visible ~ #subtitle-display{
  bottom:115px;
}
</style>
</head>
<body>

<header>
  <div class="logo">VAULT<span>.TV</span></div>
  <div class="header-right">
    <div class="pill" id="count">Loading…</div>
  </div>
</header>

<div class="container">
  <div id="error-box"></div>
  <div id="empty">
    <div class="icon">📂</div>
    <strong>No MKV files found</strong>
    <p style="margin-top:.5rem;font-size:.85rem">Check that VIDEOS_DIR in server.js points to your videos folder.</p>
  </div>
  <div class="section-title">All Videos</div>
  <div id="library"></div>
</div>

<!-- ═══════════════ PRE-PLAY MODAL ═══════════════ -->
<div id="preplay-overlay">
  <div id="preplay-card">
    <div id="preplay-header">
      <div id="preplay-title"></div>
      <div id="preplay-subtitle">Select tracks to play</div>
    </div>

    <div id="preplay-body">
      <!-- Loading state -->
      <div id="preplay-loading">
        <div class="spinner-sm"></div>
        <span>Fetching track info…</span>
      </div>

      <!-- Track selection (shown after info loads) -->
      <div id="preplay-tracks">
        <!-- Audio section -->
        <div id="preplay-audio-section">
          <div class="track-section-label">Audio Track</div>
          <div id="preplay-audio-list"></div>
        </div>

        <!-- Subtitle section -->
        <div id="preplay-sub-section">
          <div class="track-section-label">Subtitles</div>
          <div id="preplay-sub-list"></div>
        </div>
      </div>
    </div>

    <div id="preplay-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-play" id="btn-play-modal" onclick="startFromModal()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Play
      </button>
    </div>
  </div>
</div>

<!-- ═══════════════ PLAYER ═══════════════ -->
<div id="player">
  <video id="video-el" playsinline></video>

  <div id="ctrl-wrap">
    <!-- Top bar -->
    <div id="ctrl-top">
      <button class="btn-back" onclick="closePlayer()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div id="player-title"></div>
      <!-- Shows which audio track is playing (read-only) -->
      <div id="audio-now-playing" style="display:none"></div>
    </div>

    <div id="ctrl-spacer"></div>

    <!-- Bottom controls -->
    <div id="ctrl-bottom">
      <!-- Seek bar -->
      <div id="progress-wrap">
        <div id="progress-bg">
          <div id="progress-fill" style="width:0%"></div>
        </div>
        <input id="progress-input" type="range" min="0" max="1000" value="0"/>
      </div>

      <!-- Button row -->
      <div id="ctrl-row">
        <!-- Play/Pause -->
        <button class="ctrl-btn" id="btn-play" onclick="togglePlay()">
          <svg id="icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>

        <!-- Skip back 10s -->
        <button class="ctrl-btn" onclick="skipBy(-10)">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7v3l4-4-4-4v3z"/><text x="9" y="15" font-size="6" fill="currentColor" font-family="sans-serif">10</text></svg>
        </button>

        <!-- Skip forward 10s -->
        <button class="ctrl-btn" onclick="skipBy(10)">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M11.5 3a9 9 0 1 1-9 9h2a7 7 0 1 0 7-7V2l4 4-4 4V7z"/><text x="8" y="15" font-size="6" fill="currentColor" font-family="sans-serif">10</text></svg>
        </button>

        <!-- Volume -->
        <div id="vol-wrap">
          <button class="ctrl-btn" onclick="toggleMute()">
            <svg id="icon-vol" width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
            <svg id="icon-mute" width="19" height="19" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input id="vol-slider" type="range" min="0" max="100" value="100"/>
        </div>

        <div id="time-display">0:00 / 0:00</div>

        <div id="ctrl-right">
          <!-- Subtitle button (still switchable mid-session — separate VTT files) -->
          <button class="menu-btn" id="btn-sub" onclick="toggleMenu('sub-menu')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg>
            <span id="sub-label">Off</span>
          </button>
          <div class="track-menu" id="sub-menu">
            <div class="menu-label">Subtitles</div>
          </div>

          <!-- Fullscreen -->
          <button class="ctrl-btn" onclick="toggleFullscreen()">
            <svg id="icon-expand" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            <svg id="icon-compress" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 0 2 2v3"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Starting transcode…</div>
  </div>

  <!-- Chunk progress badge -->
  <div id="chunk-badge">
    <div class="cb-bar"><div class="cb-fill" id="cb-fill" style="width:0%"></div></div>
    <span id="cb-text">Loading…</span>
  </div>

  <!-- Play/pause flash -->
  <div id="play-flash">
    <div class="flash-icon" id="flash-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="white" id="flash-svg"><path d="M8 5v14l11-7z"/></svg>
    </div>
  </div>

  <!-- Skip flashes -->
  <div class="skip-flash" id="skip-back-flash">−10s</div>
  <div class="skip-flash" id="skip-fwd-flash">+10s</div>
  <!-- Custom subtitle display — sits above ctrl-bar when controls visible -->
  <div id="subtitle-display"></div>
</div>

<!-- ═══════════════ SCRIPT ═══════════════ -->
<script>
let hls            = null;
let hideTimer      = null;
let currentSubIdx  = -1;
let progressPoller = null;
let currentStreamId = null;

// Subtitle renderer state
let subCueListener  = null;
let subTrackRef     = null;
let subAttachPoller = null;

// Modal state
let modalFilename    = null;
let modalDisplayName = null;
let selectedAudioIdx = 0;
let selectedSubIdx   = -1;

const video = document.getElementById('video-el');
const wrap  = document.getElementById('ctrl-wrap');

// ── Library ──────────────────────────────────────
async function loadLibrary() {
  try {
    const r = await fetch('/api/videos');
    const videos = await r.json();
    if (videos.error) { showError(videos.error); return; }

    document.getElementById('count').textContent = `${videos.length} title${videos.length !== 1 ? 's' : ''}`;

    if (videos.length === 0) {
      document.getElementById('empty').classList.add('show');
      return;
    }

    const grid = document.getElementById('library');
    grid.innerHTML = '';
    videos.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-art">
          <div class="card-art-icon">🎞</div>
          <div class="card-art-num">${String(i + 1).padStart(2, '0')}</div>
        </div>
        <div class="card-body">
          <div class="card-title" title="${v.displayName}">${v.displayName}</div>
          <div class="card-meta">
            <span class="card-tag">MKV</span>
            <span>${v.size}</span>
          </div>
        </div>`;
      card.addEventListener('click', () => openModal(v.filename, v.displayName));
      grid.appendChild(card);
    });
  } catch (e) {
    showError('Cannot connect to server. Is server.js running?');
  }
}

// ── Pre-play modal ───────────────────────────────
async function openModal(filename, displayName) {
  modalFilename    = filename;
  modalDisplayName = displayName;
  selectedAudioIdx = 0;
  selectedSubIdx   = -1;

  document.getElementById('preplay-title').textContent = displayName;
  document.getElementById('preplay-loading').classList.remove('hide');
  document.getElementById('preplay-tracks').classList.remove('show');
  document.getElementById('btn-play-modal').disabled = true;
  document.getElementById('preplay-overlay').classList.add('show');

  try {
    const r    = await fetch(`/api/info/${encodeURIComponent(filename)}`);
    const info = await r.json();
    if (info.error) throw new Error(info.error);
    buildModalTracks(info.audio || [], info.subtitles || []);
  } catch (e) {
    closeModal();
    showError('Could not load track info: ' + e.message);
  }
}

function buildModalTracks(audioTracks, subTracks) {
  // ── Audio tracks ──
  const audioList = document.getElementById('preplay-audio-list');
  audioList.innerHTML = '';

  if (audioTracks.length === 0) {
    document.getElementById('preplay-audio-section').style.display = 'none';
  } else {
    document.getElementById('preplay-audio-section').style.display = '';
    audioTracks.forEach((t, i) => {
      const el = document.createElement('div');
      el.className = 'track-option' + (i === 0 ? ' selected' : '');
      el.dataset.idx = i;
      el.innerHTML = `
        <div class="track-radio"><div class="track-radio-dot"></div></div>
        <div class="track-option-info">
          <div class="track-option-name">${t.label}</div>
          <div class="track-option-detail">${t.codec?.toUpperCase() || ''}${t.channels ? ' · ' + channelLabel(t.channels) : ''}</div>
        </div>
        <div class="track-badge">${(t.language || 'UND').toUpperCase()}</div>`;
      el.addEventListener('click', () => {
        audioList.querySelectorAll('.track-option').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        selectedAudioIdx = i;
      });
      audioList.appendChild(el);
    });
  }

  // ── Subtitle tracks ──
  const subList = document.getElementById('preplay-sub-list');
  subList.innerHTML = '';

  // "Off" option (default)
  const offEl = document.createElement('div');
  offEl.className = 'track-option selected';
  offEl.innerHTML = `
    <div class="track-radio"><div class="track-radio-dot"></div></div>
    <div class="track-option-info">
      <div class="track-option-name">Off</div>
      <div class="track-option-detail">No subtitles</div>
    </div>`;
  offEl.addEventListener('click', () => {
    subList.querySelectorAll('.track-option').forEach(x => x.classList.remove('selected'));
    offEl.classList.add('selected');
    selectedSubIdx = -1;
  });
  subList.appendChild(offEl);

  subTracks.forEach((t, i) => {
    const el = document.createElement('div');
    el.className = 'track-option';
    el.innerHTML = `
      <div class="track-radio"><div class="track-radio-dot"></div></div>
      <div class="track-option-info">
        <div class="track-option-name">${t.label}</div>
      </div>
      <div class="track-badge">${(t.language || 'UND').toUpperCase()}</div>`;
    el.addEventListener('click', () => {
      subList.querySelectorAll('.track-option').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      selectedSubIdx = i;
    });
    subList.appendChild(el);
  });

  // Reveal tracks, hide loader
  document.getElementById('preplay-loading').classList.add('hide');
  document.getElementById('preplay-tracks').classList.add('show');
  document.getElementById('btn-play-modal').disabled = false;
}

function channelLabel(n) {
  if (n === 6) return '5.1';
  if (n === 8) return '7.1';
  if (n === 2) return 'Stereo';
  if (n === 1) return 'Mono';
  return `${n}ch`;
}

function closeModal() {
  document.getElementById('preplay-overlay').classList.remove('show');
  modalFilename = null;
}

async function startFromModal() {
  if (!modalFilename) return;

  const filename    = modalFilename;
  const displayName = modalDisplayName;
  const audioIdx    = selectedAudioIdx;
  const subIdx      = selectedSubIdx;

  closeModal();

  // Open player and start loading
  document.getElementById('player').classList.add('show');
  document.getElementById('player-title').textContent = displayName;
  document.getElementById('loading-overlay').classList.add('show');
  document.getElementById('loading-text').textContent = 'Processing first chunk…';
  document.body.style.overflow = 'hidden';

  try {
    const streamRes = await fetch(`/api/stream/${encodeURIComponent(filename)}?audio=${audioIdx}`);
    const data      = await streamRes.json();

    if (data.error) { showError(data.error); closePlayer(); return; }

    document.getElementById('loading-overlay').classList.remove('show');

    currentStreamId = data.streamId;
    currentSubIdx   = subIdx;

    // Fetch track info again for the subtitle menu (to show correct labels)
    const infoRes = await fetch(`/api/info/${encodeURIComponent(filename)}`);
    const info    = await infoRes.json();

    // Show audio badge in top bar
    const audioLabel = info.audio?.[audioIdx]?.label || `Track ${audioIdx + 1}`;
    const badge = document.getElementById('audio-now-playing');
    badge.textContent = '🎵 ' + audioLabel;
    badge.style.display = '';

    // Build subtitle menu (still switchable)
    buildSubMenu(info.subtitles || []);

    startHLS(data.streamUrl, subIdx);
    startProgressPolling(data.streamId);

  } catch (e) {
    showError('Failed to start: ' + e.message);
    closePlayer();
  }
}

// ── Player ───────────────────────────────────────
function startHLS(url, initialSubIdx) {
  if (hls) { hls.destroy(); hls = null; }

  if (!Hls.isSupported()) {
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url; video.play();
    } else { showError('HLS not supported in this browser.'); }
    return;
  }

  hls = new Hls({ enableWorker: true });
  hls.loadSource(url);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    video.play();
    applySubTrack(initialSubIdx);
  });
  hls.on(Hls.Events.ERROR, (_, d) => {
    if (d.fatal) showError('Playback error: ' + d.details);
  });
}

function closePlayer() {
  video.pause();
  if (hls) { hls.destroy(); hls = null; }
  video.src = '';
  document.getElementById('player').classList.remove('show');
  document.getElementById('loading-overlay').classList.remove('show');
  document.getElementById('audio-now-playing').style.display = 'none';
  document.body.style.overflow = '';
  stopProgressPolling();
  stopSubtitleRenderer();
  const display = document.getElementById('subtitle-display');
  if (display) display.innerHTML = '';
  currentSubIdx   = -1;
  currentStreamId = null;
  resetUI();
}

// ── Chunk progress polling ────────────────────────
function startProgressPolling(streamId) {
  stopProgressPolling();
  if (!streamId) return;

  async function poll() {
    try {
      const r = await fetch(`/api/progress/${streamId}`);
      const p = await r.json();
      if (!p.found || p.done) { hideBadge(); stopProgressPolling(); return; }
      const pct = p.percent;
      document.getElementById('cb-fill').style.width = pct + '%';
      document.getElementById('cb-text').textContent = `Loading ${pct}%`;
      document.getElementById('chunk-badge').classList.add('show');
    } catch {}
  }

  poll();
  progressPoller = setInterval(poll, 4000);
}

function stopProgressPolling() {
  if (progressPoller) { clearInterval(progressPoller); progressPoller = null; }
}

function hideBadge() {
  document.getElementById('chunk-badge').classList.remove('show');
}

// ── Subtitle menu (mid-session switching still works) ──
function buildSubMenu(subTracks) {
  const subMenu = document.getElementById('sub-menu');
  subMenu.innerHTML = '<div class="menu-label">Subtitles</div>';

  const offItem = document.createElement('div');
  offItem.className = 'track-item' + (currentSubIdx === -1 ? ' selected' : '') + ' off-item';
  offItem.innerHTML = `<div class="dot"></div>Off`;
  offItem.addEventListener('click', () => selectSub(-1, 'Off'));
  subMenu.appendChild(offItem);

  if (subTracks.length > 0) {
    const div = document.createElement('div');
    div.className = 'menu-divider';
    subMenu.appendChild(div);

    subTracks.forEach((t, i) => {
      const item = document.createElement('div');
      item.className = 'track-item' + (i === currentSubIdx ? ' selected' : '');
      item.innerHTML = `<div class="dot"></div>${t.label}`;
      item.addEventListener('click', () => selectSub(i, t.label));
      subMenu.appendChild(item);
    });
    document.getElementById('btn-sub').classList.add('has-content');
  }

  document.getElementById('sub-label').textContent = currentSubIdx === -1 ? 'Off'
    : (subTracks[currentSubIdx]?.label || 'Sub');
}

function selectSub(index, label) {
  currentSubIdx = index;
  applySubTrack(index);
  document.getElementById('sub-label').textContent = label;
  document.querySelectorAll('#sub-menu .track-item').forEach((el, i) => {
    el.classList.toggle('selected', i === 0 ? index === -1 : i - 1 === index);
  });
  closeMenus();
}

function applySubTrack(index) {
  stopSubtitleRenderer();
  const display = document.getElementById('subtitle-display');
  if (display) display.innerHTML = '';

  if (!hls) return;

  // Tell HLS.js which subtitle track to load (triggers VTT fetch)
  hls.subtitleTrack = index;

  // Hide all native tracks — we render cues ourselves so they
  // never overlap the control bar
  if (video.textTracks) {
    Array.from(video.textTracks).forEach(t => { t.mode = 'hidden'; });
  }

  if (index === -1) return;

  // Attach our custom cue renderer, polling until the track is ready
  function tryAttach() {
    const tracks = video.textTracks;
    if (!tracks || index >= tracks.length) return false;
    const track = tracks[index];
    track.mode = 'hidden';

    subCueListener = () => {
      if (!display) return;
      if (!track.activeCues || track.activeCues.length === 0) {
        display.innerHTML = ''; return;
      }
      const lines = [];
      for (const cue of track.activeCues) {
        // Strip VTT timestamp tags like <00:01:02.345>, keep text
        const text = (cue.text || '')
          .replace(/<\d{2}:\d{2}:\d{2}\.\d{3}>/g, '')
          .replace(/<[^>]+>/g, '')   // strip remaining VTT tags
          .trim();
        if (text) lines.push(text);
      }
      display.innerHTML = lines.join('<br>');
    };

    subTrackRef = track;
    track.addEventListener('cuechange', subCueListener);
    subCueListener(); // render any cues that are already active
    return true;
  }

  if (!tryAttach()) {
    // Track not ready yet — poll until HLS.js creates it
    subAttachPoller = setInterval(() => {
      if (tryAttach()) {
        clearInterval(subAttachPoller);
        subAttachPoller = null;
      }
    }, 150);
    // Give up after 15 s to avoid leaking
    setTimeout(() => {
      if (subAttachPoller) { clearInterval(subAttachPoller); subAttachPoller = null; }
    }, 15000);
  }
}

function stopSubtitleRenderer() {
  if (subAttachPoller) { clearInterval(subAttachPoller); subAttachPoller = null; }
  if (subTrackRef && subCueListener) {
    subTrackRef.removeEventListener('cuechange', subCueListener);
  }
  subTrackRef    = null;
  subCueListener = null;
}

// ── Controls visibility ──────────────────────────
function showControls() {
  wrap.classList.add('visible');
  wrap.classList.remove('hidden');
  clearTimeout(hideTimer);
  if (!video.paused) {
    hideTimer = setTimeout(() => {
      wrap.classList.remove('visible');
      wrap.classList.add('hidden');
    }, 3000);
  }
}

document.getElementById('player').addEventListener('mousemove', showControls);
document.getElementById('player').addEventListener('touchstart', showControls);

document.getElementById('player').addEventListener('click', (e) => {
  if (e.target.closest('#ctrl-top') || e.target.closest('#ctrl-bottom')) return;
  togglePlay();
});

// ── Playback controls ────────────────────────────
function togglePlay() {
  if (video.paused) { video.play(); flashIcon('play'); }
  else              { video.pause(); flashIcon('pause'); }
}

function skipBy(s) {
  video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + s));
  if (s < 0) flashSkip('back'); else flashSkip('fwd');
}

function toggleMute() {
  video.muted = !video.muted;
  updateVolIcon();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) document.getElementById('player').requestFullscreen();
  else document.exitFullscreen();
}

function flashIcon(state) {
  const el  = document.getElementById('flash-icon');
  const svg = document.getElementById('flash-svg');
  svg.innerHTML = state === 'play'
    ? '<path d="M8 5v14l11-7z"/>'
    : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 600);
}

function flashSkip(dir) {
  const el = document.getElementById(dir === 'back' ? 'skip-back-flash' : 'skip-fwd-flash');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 700);
}

// ── Progress bar ─────────────────────────────────
const progressInput = document.getElementById('progress-input');
const progressFill  = document.getElementById('progress-fill');
const timeDisplay   = document.getElementById('time-display');

video.addEventListener('timeupdate', () => {
  const pct = video.duration ? video.currentTime / video.duration : 0;
  progressFill.style.width = (pct * 100) + '%';
  progressInput.value = Math.round(pct * 1000);
  timeDisplay.textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration || 0);
});

progressInput.addEventListener('input', () => {
  if (video.duration) video.currentTime = (progressInput.value / 1000) * video.duration;
});

// ── Volume ───────────────────────────────────────
const volSlider = document.getElementById('vol-slider');
volSlider.addEventListener('input', () => {
  video.volume = volSlider.value / 100;
  video.muted  = video.volume === 0;
  volSlider.style.setProperty('--pct', volSlider.value + '%');
  updateVolIcon();
});

function updateVolIcon() {
  document.getElementById('icon-vol').style.display  = video.muted ? 'none' : '';
  document.getElementById('icon-mute').style.display = video.muted ? ''     : 'none';
}

// ── Play/pause icon sync ─────────────────────────
video.addEventListener('play',  () => {
  document.getElementById('icon-play').style.display  = 'none';
  document.getElementById('icon-pause').style.display = '';
});
video.addEventListener('pause', () => {
  document.getElementById('icon-play').style.display  = '';
  document.getElementById('icon-pause').style.display = 'none';
  showControls();
});

// ── Fullscreen icon sync ─────────────────────────
document.addEventListener('fullscreenchange', () => {
  const full = !!document.fullscreenElement;
  document.getElementById('icon-expand').style.display   = full ? 'none' : '';
  document.getElementById('icon-compress').style.display = full ? ''     : 'none';
});

// ── Keyboard shortcuts ───────────────────────────
document.addEventListener('keydown', (e) => {
  // Close modal on Escape
  if (e.key === 'Escape' && document.getElementById('preplay-overlay').classList.contains('show')) {
    closeModal(); return;
  }
  if (!document.getElementById('player').classList.contains('show')) return;
  if (e.target.tagName === 'INPUT') return;
  switch(e.key) {
    case ' ':
    case 'k': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft':  skipBy(-10); break;
    case 'ArrowRight': skipBy(10);  break;
    case 'ArrowUp':   e.preventDefault(); volSlider.value = Math.min(100, +volSlider.value + 10); volSlider.dispatchEvent(new Event('input')); break;
    case 'ArrowDown': e.preventDefault(); volSlider.value = Math.max(0,   +volSlider.value - 10); volSlider.dispatchEvent(new Event('input')); break;
    case 'f': toggleFullscreen(); break;
    case 'm': toggleMute(); break;
    case 'Escape': if (!document.fullscreenElement) closePlayer(); break;
  }
});

// Close modal on overlay click
document.getElementById('preplay-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('preplay-overlay')) closeModal();
});

// ── Menus ─────────────────────────────────────────
function toggleMenu(id) {
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains('open');
  closeMenus();
  if (!wasOpen) el.classList.add('open');
}

function closeMenus() {
  document.querySelectorAll('.track-menu').forEach(m => m.classList.remove('open'));
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('.menu-btn') && !e.target.closest('.track-menu')) closeMenus();
});

// ── Helpers ──────────────────────────────────────
function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

function resetUI() {
  progressFill.style.width = '0%';
  progressInput.value = 0;
  timeDisplay.textContent = '0:00 / 0:00';
  document.getElementById('sub-menu').innerHTML = '<div class="menu-label">Subtitles</div>';
  document.getElementById('sub-label').textContent = 'Off';
  document.getElementById('btn-sub').classList.remove('has-content');
}

function showError(msg) {
  const el = document.getElementById('error-box');
  el.textContent = '⚠ ' + msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 9000);
}

loadLibrary();
</script>
</body>
</html>
